<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Custom V2.1</title>
<style>
  :root {
    --bg: #111;
    --overlay: rgba(0,0,0,.48);
    --panel: rgba(10,10,10,.52);
    --panel-border: rgba(255,255,255,.18);
    --text: #fff;
    --muted: rgba(255,255,255,.72);
    --accent: #fff;
    --unit-bg: rgba(255,255,255,.08);
    --unit-border: rgba(255,255,255,.13);
    --button-bg: #fff;
    --button-text: #111;
    --secondary-bg: rgba(255,255,255,.12);
    --secondary-text: #fff;
    --radius: 28px;
    --font: Inter, Arial, Helvetica, sans-serif;
    --weight: 800;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: var(--font); }

  body {
    min-height: 100vh;
    color: var(--text);
    background: var(--bg) url("background.png") center/cover fixed no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    overflow-x: hidden;
    transition: background-color .25s ease, color .25s ease, font-family .25s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: -1;
    transition: background .25s ease;
  }

  .app {
    width: min(1050px, 100%);
    min-height: min(760px, calc(100vh - 48px));
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 46px 28px 34px;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    background: var(--panel);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
    text-align: center;
    transition: background .25s ease, border-color .25s ease, border-radius .25s ease;
  }

  .name {
    width: 100%;
    font-size: clamp(28px, 5vw, 64px);
    font-weight: var(--weight);
    letter-spacing: .08em;
    text-transform: uppercase;
    line-height: 1.08;
    color: var(--text);
    text-shadow: 0 3px 16px rgba(0,0,0,.7);
    word-break: break-word;
  }

  .target {
    margin-top: 12px;
    color: var(--muted);
    font-size: clamp(13px, 2vw, 18px);
  }

  .countdown {
    margin: 44px 0 34px;
    display: grid;
    grid-template-columns: repeat(4, minmax(70px, 1fr));
    gap: clamp(8px, 2vw, 22px);
    width: min(900px, 100%);
  }

  .unit {
    padding: 20px 10px;
    border-radius: calc(var(--radius) * .7);
    background: var(--unit-bg);
    border: 1px solid var(--unit-border);
    transition: background .25s ease, border-color .25s ease, border-radius .25s ease;
  }

  .value {
    font-size: clamp(42px, 8vw, 92px);
    line-height: .95;
    font-weight: var(--weight);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .label {
    margin-top: 12px;
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--muted);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  button {
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--button-text);
    background: var(--button-bg);
    transition: transform .15s ease, background .25s ease, color .25s ease;
  }

  button:hover { transform: translateY(-1px); }
  button.secondary {
    color: var(--secondary-text);
    background: var(--secondary-bg);
    border: 1px solid var(--panel-border);
  }

  .status {
    min-height: 22px;
    margin-top: 16px;
    color: var(--muted);
    font-size: 13px;
  }

  .timeup {
    color: var(--accent);
    font-weight: var(--weight);
    letter-spacing: .12em;
  }

  .settings {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.68);
    z-index: 10;
  }

  .settings.open { display: flex; }

  .panel {
    width: min(560px, 100%);
    max-height: 90vh;
    overflow: auto;
    padding: 26px;
    border-radius: 22px;
    background: #171717;
    border: 1px solid rgba(255,255,255,.15);
    color: #fff;
    box-shadow: 0 25px 70px rgba(0,0,0,.6);
  }

  .panel h2 { margin: 0 0 20px; }

  .section-title {
    margin: 24px 0 12px;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
  }

  .row {
    margin-bottom: 14px;
    text-align: left;
  }

  label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    color: rgba(255,255,255,.68);
  }

  input[type="text"],
  input[type="date"],
  input[type="time"],
  input[type="file"],
  select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.18);
    background: #0e0e0e;
    color: #fff;
  }

  input[type="color"] {
    width: 100%;
    height: 44px;
    padding: 3px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.18);
    background: #0e0e0e;
    cursor: pointer;
  }

  input[type="range"] {
    width: 100%;
    accent-color: #fff;
  }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .theme-btn {
    padding: 11px 8px;
    border-radius: 10px;
    background: #252525;
    color: #fff;
    border: 1px solid rgba(255,255,255,.14);
  }

  .theme-btn.active {
    outline: 2px solid #fff;
    outline-offset: 1px;
  }

  .custom-controls {
    display: none;
    margin-top: 12px;
  }

  .custom-controls.show { display: block; }

  .preview {
    margin-top: 10px;
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.15);
    background: #0d0d0d;
  }

  .small {
    font-size: 11px;
    line-height: 1.45;
    color: rgba(255,255,255,.5);
    margin-top: 8px;
  }

  .settings-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  @media (max-width: 650px) {
    body { padding: 10px; }
    .app {
      min-height: calc(100vh - 20px);
      border-radius: 20px;
      padding: 30px 14px 22px;
    }
    .countdown { gap: 6px; margin-top: 30px; }
    .unit { padding: 15px 5px; border-radius: 14px; }
    .label { font-size: 9px; letter-spacing: .1em; }
    button { padding: 12px 14px; }
    .theme-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<body>
<main class="app">
  <div id="nameDisplay" class="name">MY COUNTDOWN</div>
  <div id="targetDisplay" class="target">Set a target date and time in Settings</div>

  <section class="countdown" aria-label="Countdown">
    <div class="unit"><div id="days" class="value">0</div><div class="label">DAYS</div></div>
    <div class="unit"><div id="hours" class="value">00</div><div class="label">HOURS</div></div>
    <div class="unit"><div id="minutes" class="value">00</div><div class="label">MINUTES</div></div>
    <div class="unit"><div id="seconds" class="value">00</div><div class="label">SECONDS</div></div>
  </section>

  <div class="controls">
    <button id="startBtn">START / UPDATE</button>
    <button id="resetBtn" class="secondary">RESET</button>
    <button id="fullscreenBtn" class="secondary">FULL SCREEN</button>
    <button id="settingsBtn" class="secondary">⚙ SETTINGS</button>
  </div>
  <div id="status" class="status"></div>
</main>

<div id="settings" class="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="panel">
    <h2 id="settingsTitle">Settings</h2>

    <div class="section-title">Countdown</div>

    <div class="row">
      <label for="nameInput">Countdown Name</label>
      <input id="nameInput" type="text" maxlength="80" placeholder="e.g. Project Launch">
    </div>

    <div class="row">
      <label for="dateInput">End Date</label>
      <input id="dateInput" type="date">
    </div>

    <div class="row">
      <label for="timeInput">End Time</label>
      <input id="timeInput" type="time">
    </div>

    <div class="section-title">Theme</div>

    <div id="themeGrid" class="theme-grid">
      <button class="theme-btn" data-theme="dark">Dark</button>
      <button class="theme-btn" data-theme="light">Light</button>
      <button class="theme-btn" data-theme="minimal">Minimal</button>
      <button class="theme-btn" data-theme="pastel">Pastel</button>
      <button class="theme-btn" data-theme="digital">Digital</button>
      <button class="theme-btn" data-theme="custom">Custom</button>
    </div>

    <div id="customControls" class="custom-controls">
      <div class="row">
        <label for="textColor">Main Text</label>
        <input id="textColor" type="color" value="#ffffff">
      </div>
      <div class="row">
        <label for="accentColor">Countdown / Accent</label>
        <input id="accentColor" type="color" value="#ffffff">
      </div>
      <div class="row">
        <label for="panelColor">Panel</label>
        <input id="panelColor" type="color" value="#111111">
      </div>
      <div class="row">
        <label for="panelOpacity">Panel Transparency</label>
        <input id="panelOpacity" type="range" min="0" max="90" value="52">
      </div>
      <div class="row">
        <label for="fontSelect">Font</label>
        <select id="fontSelect">
          <option value="Inter">Inter</option>
          <option value="Arial">Arial</option>
          <option value="Roboto">Roboto</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Orbitron">Orbitron</option>
        </select>
      </div>
      <div class="row">
        <label for="weightSelect">Font Weight</label>
        <select id="weightSelect">
          <option value="600">Semi Bold</option>
          <option value="700">Bold</option>
          <option value="800">Extra Bold</option>
        </select>
      </div>
    </div>

    <div class="section-title">Background</div>

    <div class="row">
      <label for="bgInput">Background Image</label>
      <input id="bgInput" type="file" accept="image/*">
      <img id="preview" class="preview" src="background.png" alt="Background preview">
      <div class="small">
        Your selected image is resized in your browser and stored locally.
        It is not uploaded to GitHub or sent to a server.
      </div>
    </div>

    <div class="settings-actions">
      <button id="saveSettingsBtn">SAVE</button>
      <button id="defaultBgBtn" class="secondary">RESET BACKGROUND</button>
      <button id="resetThemeBtn" class="secondary">RESET THEME</button>
      <button id="closeSettingsBtn" class="secondary">CLOSE</button>
    </div>
  </div>
</div>

<script>
(() => {
  const COUNTDOWN_KEY = "customCountdown.v2.1";
  const BG_KEY = "customCountdown.background.v2.1";
  const THEME_KEY = "customCountdown.theme.v2.1";
  const DEFAULT_BG = "background.png";

  const THEMES = {
    dark: {
      bg: "#111111", overlay: "rgba(0,0,0,.48)", panel: "rgba(10,10,10,.52)",
      panelBorder: "rgba(255,255,255,.18)", text: "#ffffff", muted: "rgba(255,255,255,.72)",
      accent: "#ffffff", unitBg: "rgba(255,255,255,.08)", unitBorder: "rgba(255,255,255,.13)",
      buttonBg: "#ffffff", buttonText: "#111111", secondaryBg: "rgba(255,255,255,.12)",
      secondaryText: "#ffffff", radius: "28px", font: "Inter, Arial, Helvetica, sans-serif", weight: "800"
    },
    light: {
      bg: "#f3f3f3", overlay: "rgba(255,255,255,.34)", panel: "rgba(255,255,255,.78)",
      panelBorder: "rgba(0,0,0,.14)", text: "#111111", muted: "rgba(17,17,17,.65)",
      accent: "#111111", unitBg: "rgba(0,0,0,.055)", unitBorder: "rgba(0,0,0,.12)",
      buttonBg: "#111111", buttonText: "#ffffff", secondaryBg: "rgba(0,0,0,.08)",
      secondaryText: "#111111", radius: "22px", font: "Inter, Arial, Helvetica, sans-serif", weight: "700"
    },
    minimal: {
      bg: "#f7f7f5", overlay: "rgba(255,255,255,.45)", panel: "rgba(255,255,255,.82)",
      panelBorder: "rgba(0,0,0,.09)", text: "#202020", muted: "rgba(32,32,32,.58)",
      accent: "#202020", unitBg: "rgba(0,0,0,.025)", unitBorder: "rgba(0,0,0,.08)",
      buttonBg: "#202020", buttonText: "#ffffff", secondaryBg: "rgba(0,0,0,.055)",
      secondaryText: "#202020", radius: "10px", font: "Arial, Helvetica, sans-serif", weight: "700"
    },
    pastel: {
      bg: "#f6edf7", overlay: "rgba(255,255,255,.28)", panel: "rgba(255,250,255,.70)",
      panelBorder: "rgba(116,86,126,.18)", text: "#493d52", muted: "rgba(73,61,82,.62)",
      accent: "#7b5f8f", unitBg: "rgba(255,255,255,.30)", unitBorder: "rgba(123,95,143,.18)",
      buttonBg: "#7b5f8f", buttonText: "#ffffff", secondaryBg: "rgba(123,95,143,.12)",
      secondaryText: "#5d4869", radius: "24px", font: "Montserrat, Arial, sans-serif", weight: "700"
    },
    digital: {
      bg: "#050a0d", overlay: "rgba(0,0,0,.58)", panel: "rgba(3,12,16,.70)",
      panelBorder: "rgba(0,229,255,.30)", text: "#d9fbff", muted: "rgba(180,235,242,.70)",
      accent: "#00e5ff", unitBg: "rgba(0,229,255,.07)", unitBorder: "rgba(0,229,255,.24)",
      buttonBg: "#00e5ff", buttonText: "#001015", secondaryBg: "rgba(0,229,255,.10)",
      secondaryText: "#baf7ff", radius: "12px", font: "Orbitron, Arial, sans-serif", weight: "700"
    }
  };

  const $ = id => document.getElementById(id);
  let timer = null;
  let state = { name: "", date: "", time: "" };
  let themeName = "dark";
  let customTheme = null;

  function setStatus(message, isTimeUp = false) {
    $("status").textContent = message;
    $("status").className = "status" + (isTimeUp ? " timeup" : "");
  }

  function formatTarget(date, time) {
    if (!date || !time) return "Set a target date and time in Settings";
    const d = new Date(`${date}T${time}`);
    if (Number.isNaN(d.getTime())) return "Invalid target";
    return `Target: ${d.toLocaleString()}`;
  }

  function updateDisplay() {
    $("nameDisplay").textContent = state.name || "MY COUNTDOWN";
    $("targetDisplay").textContent = formatTarget(state.date, state.time);
  }

  function saveState() {
    localStorage.setItem(COUNTDOWN_KEY, JSON.stringify(state));
  }

  function getTarget() {
    if (!state.date || !state.time) return null;
    const target = new Date(`${state.date}T${state.time}`);
    return Number.isNaN(target.getTime()) ? null : target;
  }

  function tick() {
    const target = getTarget();
    if (!target) {
      ["days","hours","minutes","seconds"].forEach((id, i) => $(id).textContent = i === 0 ? "0" : "00");
      setStatus("Set a valid target date and time.");
      return;
    }

    const diff = target.getTime() - Date.now();
    if (diff <= 0) {
      $("days").textContent = "0";
      $("hours").textContent = "00";
      $("minutes").textContent = "00";
      $("seconds").textContent = "00";
      setStatus("TIME'S UP", true);
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    $("days").textContent = Math.floor(totalSeconds / 86400);
    $("hours").textContent = String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, "0");
    $("minutes").textContent = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
    $("seconds").textContent = String(totalSeconds % 60).padStart(2, "0");
    setStatus("Countdown running");
  }

  function startTimer() {
    clearInterval(timer);
    tick();
    timer = setInterval(tick, 250);
  }

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(COUNTDOWN_KEY) || "null");
      if (saved && typeof saved === "object") state = {
        name: saved.name || "", date: saved.date || "", time: saved.time || ""
      };
    } catch (_) {}
    $("nameInput").value = state.name;
    $("dateInput").value = state.date;
    $("timeInput").value = state.time;
    updateDisplay();
    startTimer();
  }

  function applyBackground(src) {
    document.body.style.backgroundImage = `url("${src}")`;
    $("preview").src = src;
  }

  function loadBackground() {
    const saved = localStorage.getItem(BG_KEY);
    applyBackground(saved || DEFAULT_BG);
  }

  function hexToRgba(hex, alpha) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0,2), 16), g = parseInt(h.slice(2,4), 16), b = parseInt(h.slice(4,6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function setVars(t) {
    const root = document.documentElement;
    root.style.setProperty("--bg", t.bg);
    root.style.setProperty("--overlay", t.overlay);
    root.style.setProperty("--panel", t.panel);
    root.style.setProperty("--panel-border", t.panelBorder);
    root.style.setProperty("--text", t.text);
    root.style.setProperty("--muted", t.muted);
    root.style.setProperty("--accent", t.accent);
    root.style.setProperty("--unit-bg", t.unitBg);
    root.style.setProperty("--unit-border", t.unitBorder);
    root.style.setProperty("--button-bg", t.buttonBg);
    root.style.setProperty("--button-text", t.buttonText);
    root.style.setProperty("--secondary-bg", t.secondaryBg);
    root.style.setProperty("--secondary-text", t.secondaryText);
    root.style.setProperty("--radius", t.radius);
    root.style.setProperty("--font", t.font);
    root.style.setProperty("--weight", t.weight);
  }

  function refreshThemeButtons() {
    document.querySelectorAll(".theme-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.theme === themeName);
    });
    $("customControls").classList.toggle("show", themeName === "custom");
  }

  function applyTheme(name, save = true) {
    themeName = name;
    const t = name === "custom" ? customTheme : THEMES[name];
    if (t) setVars(t);
    refreshThemeButtons();
    if (save) localStorage.setItem(THEME_KEY, JSON.stringify({ name: themeName, custom: customTheme }));
  }

  function loadTheme() {
    try {
      const saved = JSON.parse(localStorage.getItem(THEME_KEY) || "null");
      if (saved && saved.name) {
        themeName = saved.name;
        customTheme = saved.custom || null;
      }
    } catch (_) {}
    if (!THEMES[themeName] && themeName !== "custom") themeName = "dark";
    if (themeName === "custom" && !customTheme) themeName = "dark";
    applyTheme(themeName, false);
    if (customTheme) {
      $("textColor").value = customTheme.text || "#ffffff";
      $("accentColor").value = customTheme.accent || "#ffffff";
      $("panelColor").value = customTheme.panelBase || "#111111";
      $("panelOpacity").value = customTheme.panelOpacity ?? 52;
      $("fontSelect").value = customTheme.fontName || "Inter";
      $("weightSelect").value = customTheme.weight || "800";
    }
  }

  function updateCustomTheme() {
    const panelBase = $("panelColor").value;
    const opacity = Number($("panelOpacity").value);
    const alpha = Math.max(0, Math.min(0.95, opacity / 100));
    const text = $("textColor").value;
    const accent = $("accentColor").value;
    const fontName = $("fontSelect").value;
    const weight = $("weightSelect").value;

    customTheme = {
      bg: panelBase,
      overlay: hexToRgba("#000000", Math.max(.18, 1 - alpha)),
      panel: hexToRgba(panelBase, alpha),
      panelBorder: hexToRgba(text, .22),
      text,
      muted: hexToRgba(text, .68),
      accent,
      unitBg: hexToRgba(text, .07),
      unitBorder: hexToRgba(text, .16),
      buttonBg: accent,
      buttonText: panelBase,
      secondaryBg: hexToRgba(accent, .12),
      secondaryText: text,
      radius: "18px",
      font: fontName + ", Arial, Helvetica, sans-serif",
      weight,
      panelBase,
      panelOpacity: opacity,
      fontName
    };

    applyTheme("custom");
  }

  $("themeGrid").addEventListener("click", e => {
    const btn = e.target.closest(".theme-btn");
    if (!btn) return;
    const name = btn.dataset.theme;
    if (name === "custom") {
      if (!customTheme) updateCustomTheme();
      else applyTheme("custom");
    } else {
      applyTheme(name);
    }
  });

  ["textColor","accentColor","panelColor","panelOpacity","fontSelect","weightSelect"]
    .forEach(id => $(id).addEventListener("input", updateCustomTheme));

  $("startBtn").addEventListener("click", () => {
    state = {
      name: $("nameInput").value.trim(),
      date: $("dateInput").value,
      time: $("timeInput").value
    };
    saveState();
    updateDisplay();
    startTimer();
    setStatus("Countdown updated and saved.");
  });

  $("resetBtn").addEventListener("click", () => {
    state = { name: "", date: "", time: "" };
    localStorage.removeItem(COUNTDOWN_KEY);
    $("nameInput").value = "";
    $("dateInput").value = "";
    $("timeInput").value = "";
    updateDisplay();
    startTimer();
    setStatus("Countdown reset.");
  });

  $("settingsBtn").addEventListener("click", () => $("settings").classList.add("open"));
  $("closeSettingsBtn").addEventListener("click", () => $("settings").classList.remove("open"));

  $("saveSettingsBtn").addEventListener("click", () => {
    state = {
      name: $("nameInput").value.trim(),
      date: $("dateInput").value,
      time: $("timeInput").value
    };
    saveState();
    localStorage.setItem(THEME_KEY, JSON.stringify({ name: themeName, custom: customTheme }));
    updateDisplay();
    startTimer();
    $("settings").classList.remove("open");
    setStatus("Settings saved.");
  });

  $("resetThemeBtn").addEventListener("click", () => {
    customTheme = null;
    themeName = "dark";
    localStorage.removeItem(THEME_KEY);
    applyTheme("dark", false);
    $("textColor").value = "#ffffff";
    $("accentColor").value = "#ffffff";
    $("panelColor").value = "#111111";
    $("panelOpacity").value = 52;
    $("fontSelect").value = "Inter";
    $("weightSelect").value = "800";
    setStatus("Theme reset to Dark.");
  });

  $("bgInput").addEventListener("change", event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      setStatus("Please select an image file.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 1800;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressed = canvas.toDataURL("image/jpeg", 0.82);
        try {
          localStorage.setItem(BG_KEY, compressed);
          applyBackground(compressed);
          setStatus("Background changed and saved on this browser.");
        } catch (_) {
          setStatus("This image is too large for browser storage. Choose a smaller image.");
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  $("defaultBgBtn").addEventListener("click", () => {
    localStorage.removeItem(BG_KEY);
    $("bgInput").value = "";
    applyBackground(DEFAULT_BG);
    setStatus("Default background restored.");
  });

  $("fullscreenBtn").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {
      setStatus("Full screen is not available in this browser.");
    }
  });

  $("settings").addEventListener("click", e => {
    if (e.target === $("settings")) $("settings").classList.remove("open");
  });

  loadTheme();
  loadBackground();
  loadState();
})();
</script>
</body>
</html>
